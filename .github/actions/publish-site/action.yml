name: Publish an owned Axioms Awake sub-site
description: Verify a passing source package, test its subpath, and update only its registered public folder.
inputs:
  site:
    description: Registered site ID (also the owned folder)
    required: true
  source-run-id:
    description: Exact successful main-branch build run
    required: true
  token:
    description: Optional Contents-write token restricted to AxiomsAwake/web
    required: false
  app-id:
    description: Optional publishing GitHub App ID
    required: false
  app-private-key:
    description: Optional publishing GitHub App private key
    required: false
  base-url:
    description: Public base URL, including the project prefix
    default: https://axiomsawake.github.io/web/
outputs:
  status:
    description: Repository publication disposition
    value: ${{ steps.promote.outputs.status }}
  url:
    description: Public sub-site URL (see live-status for verification)
    value: ${{ steps.promote.outputs.url }}
  web-commit:
    description: Accepted destination commit
    value: ${{ steps.promote.outputs.web_commit }}
  live-status:
    description: Serving verification is delegated to the queued Pages deployment
    value: pending-pages
runs:
  using: composite
  steps:
    - name: Require publication credentials before expensive work
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_KEY: ${{ inputs.app-private-key }}
        TOKEN: ${{ inputs.token }}
      run: |
        if [[ -z "$TOKEN" && ( -z "$APP_ID" || -z "$APP_KEY" ) ]]; then
          echo 'Configure WEB_PUBLISH_APP_ID + WEB_PUBLISH_APP_PRIVATE_KEY, or PUBLIC_RELEASE_TOKEN (Contents write on AxiomsAwake/web). No package was downloaded.' >&2
          exit 1
        fi
    - name: Allocate isolated publication workspace
      id: work
      shell: bash
      env:
        SITE_ID: ${{ inputs.site }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        [[ "$SITE_ID" =~ ^[a-z][a-z0-9-]{0,47}$ ]] || exit 1
        python3 -c 'import sys; assert sys.version_info >= (3,10), "Python 3.10+ required"'
        if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
          [[ "$(id -u)" != 0 ]] || { echo 'Use an ordinary-user runner, not root.' >&2; exit 1; }
          cache_root="${CI_SHARED_CACHE:-${RUNNER_TOOL_CACHE:-}}"
          : "${cache_root:?Set CI_SHARED_CACHE or the runner tool cache}"
          echo "PLAYWRIGHT_BROWSERS_PATH=$cache_root/playwright" >> "$GITHUB_ENV"
        else
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/axioms-web-playwright" >> "$GITHUB_ENV"
        fi
        work="$(mktemp -d "$RUNNER_TEMP/axioms-web-$SITE_ID.XXXXXX")"
        echo "path=$work" >> "$GITHUB_OUTPUT"
    - name: Verify exact source run and explicitly selected package
      id: resolve
      shell: bash
      env:
        SOURCE_TOKEN: ${{ github.token }}
        SITE_ID: ${{ inputs.site }}
        SOURCE_RUN: ${{ inputs.source-run-id }}
        WORK: ${{ steps.work.outputs.path }}
        ACTION_ROOT: ${{ github.action_path }}
      run: python3 "$ACTION_ROOT/../../../tools/publish.py" resolve --site "$SITE_ID" --run-id "$SOURCE_RUN" --candidate "$WORK/candidate.json"
    - name: Download only the verified artifact ID
      if: steps.resolve.outputs.package_kind == 'actions-artifact'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
        merge-multiple: true
        path: ${{ steps.work.outputs.path }}/incoming
        repository: ${{ github.repository }}
        run-id: ${{ steps.resolve.outputs.source_run }}
        github-token: ${{ github.token }}
    - name: Download the verified immutable release asset
      if: steps.resolve.outputs.package_kind == 'release-asset'
      shell: bash
      env:
        SOURCE_TOKEN: ${{ github.token }}
        SOURCE_REPOSITORY: ${{ github.repository }}
        ASSET_ID: ${{ steps.resolve.outputs.release_asset_id }}
        WORK: ${{ steps.work.outputs.path }}
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        curl --fail --location --proto '=https' --retry 2 --max-time 180 \
          -H "Authorization: Bearer $SOURCE_TOKEN" \
          -H 'Accept: application/octet-stream' \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/$SOURCE_REPOSITORY/releases/assets/$ASSET_ID" \
          -o "$WORK/release.zip"
        python3 "$ACTION_ROOT/../../../tools/publish.py" unpack-release \
          --candidate "$WORK/candidate.json" --artifact "$WORK/release.zip" --payload "$WORK/incoming"
    - name: Stage only the producer-approved public files
      shell: bash
      env:
        SOURCE_TOKEN: ${{ github.token }}
        WORK: ${{ steps.work.outputs.path }}
        ACTION_ROOT: ${{ github.action_path }}
      run: python3 "$ACTION_ROOT/../../../tools/publish.py" stage --candidate "$WORK/candidate.json" --artifact "$WORK/incoming" --payload "$WORK/payload"
    - name: Reuse the pinned isolated browser checker
      id: browser
      shell: bash
      env:
        WORK: ${{ steps.work.outputs.path }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ACTION_ROOT: ${{ github.action_path }}
      run: python3 "$ACTION_ROOT/../../../tools/browser_env.py" --work "$WORK"
    - name: Check final sub-site prefix and declared interactions without publishing credentials
      shell: bash
      env:
        WORK: ${{ steps.work.outputs.path }}
        ACTION_ROOT: ${{ github.action_path }}
        SITE_ID: ${{ inputs.site }}
        BROWSER_PYTHON: ${{ steps.browser.outputs.python }}
      run: '"$BROWSER_PYTHON" "$ACTION_ROOT/../../../tools/smoke.py" --site "$SITE_ID" --payload "$WORK/payload" --candidate "$WORK/candidate.json" --output "$WORK/evidence"'
    - name: Retain bounded smoke evidence on the trusted runner
      id: retention
      if: always() && steps.work.outputs.path != '' && runner.environment == 'self-hosted'
      shell: bash
      env:
        WORK: ${{ steps.work.outputs.path }}
        SITE_ID: ${{ inputs.site }}
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [[ ! -d "$WORK/evidence" ]] || ! find "$WORK/evidence" -type f -print -quit | grep -q .; then
          echo 'status=missing' >> "$GITHUB_OUTPUT"
          echo "No browser evidence was produced; publication checks and outcomes remain in this run's logs."
          exit 0
        fi
        evidence_root="${CI_SHARED_EVIDENCE:-}"
        if [[ -z "$evidence_root" ]]; then
          : "${RUNNER_TOOL_CACHE:?Set CI_SHARED_EVIDENCE or RUNNER_TOOL_CACHE for bounded evidence retention}"
          evidence_root="$RUNNER_TOOL_CACHE/axioms-evidence"
        fi
        python3 "$ACTION_ROOT/runner_evidence.py" "$WORK/evidence" \
          --evidence-root "$evidence_root" --channel "publication-$SITE_ID"
        echo 'retained=true' >> "$GITHUB_OUTPUT"
        echo 'status=retained' >> "$GITHUB_OUTPUT"
        echo "Browser evidence retained for $SITE_ID; run $GITHUB_RUN_ID attempt ${GITHUB_RUN_ATTEMPT:-1}."
        if test -s "$WORK/evidence/report.json"; then cat "$WORK/evidence/report.json"; fi
    - name: Report browser evidence retention separately
      if: always() && steps.work.outputs.path != ''
      shell: bash
      env:
        RETAINED: ${{ steps.retention.outputs.retained }}
        STATUS: ${{ steps.retention.outputs.status }}
        OUTCOME: ${{ steps.retention.outcome }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        WORK: ${{ steps.work.outputs.path }}
      run: |
        if [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$OUTCOME" == success ]]; then
          if [[ "$RETAINED" == true && "$STATUS" == retained ]]; then
            echo 'Bounded browser evidence was retained on the trusted runner.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No smoke evidence files were produced; validation results remain in this run’s logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
        elif [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$OUTCOME" == failure ]]; then
          echo "::error::Bounded runner evidence retention failed; unique smoke evidence remains at $WORK/evidence. Reproducible payload inputs will be removed."
          echo "Runner evidence retention failed; unique smoke evidence remains at `$WORK/evidence`. Inspect this run's logs before cleanup." >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
          echo 'Runner evidence retention did not run; inspect this run’s logs.' >> "$GITHUB_STEP_SUMMARY"
        else
          echo 'Hosted-runner evidence is available in this run’s logs only; no durable hosted artifact was uploaded.' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Mint token restricted to the public destination
      id: app
      if: inputs.app-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: AxiomsAwake
        repositories: web
        permission-contents: write
    - name: Promote owned folder with optimistic conflict retries
      id: promote
      shell: bash
      env:
        SOURCE_TOKEN: ${{ github.token }}
        PUBLIC_RELEASE_TOKEN: ${{ steps.app.outputs.token || inputs.token }}
        WORK: ${{ steps.work.outputs.path }}
        ACTION_ROOT: ${{ github.action_path }}
        SITE_ID: ${{ inputs.site }}
        WEB_BASE_URL: ${{ inputs.base-url }}
      run: python3 "$ACTION_ROOT/../../../tools/publish.py" promote --site "$SITE_ID" --candidate "$WORK/candidate.json" --payload "$WORK/payload"
    - name: Remove reproducible inputs after evidence retention failure
      if: always() && steps.work.outputs.path != '' && runner.environment == 'self-hosted' && steps.retention.outcome == 'failure'
      shell: bash
      env:
        WORK: ${{ steps.work.outputs.path }}
      run: |
        set -euo pipefail
        case "$WORK" in "$RUNNER_TEMP"/axioms-web-*) ;; *) exit 1 ;; esac
        rm -rf -- "$WORK/incoming" "$WORK/payload" "$WORK/candidate.json" "$WORK/release.zip"

    - name: Remove this job's temporary payload after evidence retention
      if: always() && steps.work.outputs.path != '' && (runner.environment != 'self-hosted' || steps.retention.outputs.status == 'retained' || steps.retention.outputs.status == 'missing')
      shell: bash
      env:
        WORK: ${{ steps.work.outputs.path }}
      run: |
        case "$WORK" in "$RUNNER_TEMP"/axioms-web-*) rm -rf -- "$WORK";; *) exit 1;; esac
