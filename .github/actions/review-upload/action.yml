name: Disabled optional review transfer
description: Compatibility shim; generic GitHub Actions artifact transfers are disabled.
inputs:
  enabled:
    description: Retained for caller compatibility; transfers are disabled
    default: 'false'
  directory:
    description: Retained for caller compatibility; caller-owned originals remain untouched
    required: true
  patterns:
    description: Retained for caller compatibility; no files are staged or transferred
    required: true
  name:
    description: Retained for caller compatibility; no artifact is created
    required: true
outputs:
  artifact-id:
    description: Always empty while generic transfers are disabled
    value: ${{ steps.disabled.outputs.artifact-id }}
  outcome:
    description: Disabled transport status, never a test or inspection verdict
    value: ${{ steps.disabled.outputs.outcome }}
runs:
  using: composite
  steps:
    - name: Report that optional generic transfer is disabled
      id: disabled
      if: always()
      shell: bash
      run: |
        echo 'artifact-id=' >> "$GITHUB_OUTPUT"
        echo 'outcome=disabled' >> "$GITHUB_OUTPUT"
        echo '::notice::Optional generic GitHub Actions artifact transfer is disabled. Caller-owned runner evidence is unchanged.'
        printf '\nOptional review transfer: **disabled**. Original reports remain governed by the caller; no staging copy was created.\n' >> "$GITHUB_STEP_SUMMARY"
