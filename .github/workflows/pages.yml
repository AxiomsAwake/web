name: Deploy compiled Little Lines
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: One-time import of verified PUBLIC compiled artifact only
        if: hashFiles('site/release.json') == ''
        env:
          COMPILED_ARTIFACT_URL: 'https://productionresultssa17.blob.core.windows.net/actions-results/c270ca0f-8407-4d09-92f7-9566655a21b1/workflow-job-run-8cdbe999-2559-5c7d-83e9-741b9b086eae/artifacts/b313c4ffc6d786318ece71854714d7fffa7fb69a15832844a5be0a7a7630c30f.zip?rscd=attachment%3B+filename%3D%22public-site.zip%22&rsct=application%2Fzip&se=2026-09-06T21%3A11%3A40Z&sig=17q3uEDVkFgnZUu9VreXdrg9qOVdKu1ISWk2DRVtpa8%3D&ske=2026-09-06T23%3A48%3A54Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-09-06T19%3A48%3A54Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-09-06T21%3A01%3A35Z&sv=2025-11-05'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, stat, urllib.request, zipfile
          # Approved public-site artifact only; never private source or evidence.
          with urllib.request.urlopen(os.environ['COMPILED_ARTIFACT_URL'], timeout=30) as r:
              data = r.read(2000001)
          assert len(data) <= 2000000
          assert hashlib.sha256(data).hexdigest() == '10ae70fdeca7c18ead49c9e49e03c9f59c1058483d5f5e35aa2bd1875317c943'
          archive = zipfile.ZipFile(io.BytesIO(data))
          items = archive.infolist()
          assert 1 <= len(items) <= 256
          assert sum(i.file_size for i in items) <= 20 * 1024 * 1024
          names = [i.filename for i in items]
          assert len(set(names)) == len(names)
          for item in items:
              assert not item.is_dir() and not stat.S_ISLNK(item.external_attr >> 16)
              assert item.filename in ('index.html', 'NOTICE.txt', 'release.json') or re.fullmatch(r'assets/[a-z0-9_-]+\.[a-f0-9]{20}\.(js|css|svg|png|webp|avif|woff2)', item.filename)
          manifest = json.loads(archive.read('release.json'))
          assert manifest['sourceRevision'] == '198e737dd2670ed013be2904c861ce2a1d6daff9'
          assert manifest['releaseId'] == 'c93798adc8b9c6e4a39f'
          for item in items:
              target = pathlib.Path('site') / item.filename
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(item))
          PY
      - name: Verify compiled files only
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('site')
          assert not root.is_symlink()
          manifest = root / 'release.json'
          assert not manifest.is_symlink() and manifest.stat().st_size < 256000
          m = json.loads(manifest.read_text())
          assert m['schema'] == 1 and m['application'] == 'little-lines'
          assert re.fullmatch('[a-f0-9]{20}', m['releaseId'])
          rows = m['files'] + m.get('retainedFiles', [])
          assert 1 <= len(rows) <= 256
          expected = {'release.json'}; total = 0
          for row in rows:
              name = row['path']
              assert name not in expected
              assert name in ('index.html', 'NOTICE.txt') or re.fullmatch(r'assets/[a-z0-9_-]+\.[a-f0-9]{20}\.(js|css|svg|png|webp|avif|woff2)', name)
              p = root / name
              assert p.is_file() and not p.is_symlink()
              total += p.stat().st_size
              assert total <= 20 * 1024 * 1024 and p.stat().st_size == row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == row['sha256']
              expected.add(name)
          actual = set()
          for p in root.rglob('*'):
              assert not p.is_symlink()
              if p.is_file(): actual.add(p.relative_to(root).as_posix())
          assert expected == actual and 'index.html' in expected
          print('Verified compiled release', m['releaseId'], ':', total, 'bytes')
          PY
      - name: Record compiled release in the public repository
        run: |
          git add -- site
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: c93798adc8b9c6e4a39f verified compiled game'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact compiled artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check public game with real CDN and no private credentials
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/public-smoke"
          npm install --prefix "$RUNNER_TEMP/public-smoke" --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.1
          cd "$RUNNER_TEMP/public-smoke"
          npx --no-install playwright install --with-deps chromium
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const url=new URL(process.env.PAGES_URL);
            if(url.protocol!=='https:')throw Error('Public game must use HTTPS');
            const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try {
              const page=await browser.newPage();const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(url.href,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.LittleLines?.modes && document.querySelector('#loading').style.display==='none',null,{timeout:90000});
              const stats=await page.evaluate(()=>LittleLines.modes.stats());
              if(errors.length||stats.mode!=='simulation'||stats.buses!==19)throw Error(JSON.stringify({errors,stats}));
              console.log(JSON.stringify({publicURL:url.href,browser:browser.version(),mode:stats.mode,buses:stats.buses,errors}));
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
