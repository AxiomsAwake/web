name: Clean reviewed obsolete Pages transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/previous-pages-cleanup.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: previous-pages-transport-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, romik-desktop, io-heavy]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test exact-ID deletion guards
        run: python3 -m unittest discover -s tests -p test_pages_transport.py -v
      - name: Delete only the three reviewed successful Pages transfer objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'tools')
          from pages_cleanup import api, cleanup, REPO
          from live_check import public_json, verify
          if os.environ['GITHUB_REPOSITORY'] != REPO:
              raise SystemExit('Unexpected cleanup owner')
          base = 'https://axiomsawake.github.io/web/'
          served = public_json(base + 'deployment.json?cleanup=' + os.environ['GITHUB_RUN_ID'])
          verify(served, base, seconds=60)
          # Fixed inventory reviewed on 2026-09-28. Not a glob or a retention-policy sweep.
          reviewed = [(10969853553, 36422809641, 106478754, 'a0fe7b2a27da45b665673c2ef3def985f39cfed4'),
                      (10969394591, 36422794956, 106475246, '76c1ca68bf2dacf38703466f739870b5b0d5c462'),
                      (10970210893, 36421756833, 106401899, 'e30f8cd22a98eb28d70bd08e286fc3e2fa286981')]
          admitted = []
          for artifact, run, size, source in reviewed:
              item = api('GET', '/actions/artifacts/' + str(artifact))
              if item is None:
                  print('OLD_PAGES_CLEANUP ' + json.dumps({'artifact_id': artifact, 'status': 'already-absent', 'deleted_bytes': 0}))
                  continue
              native = subprocess.run(['gh', 'api', f'repos/{REPO}/actions/runs/{run}'], capture_output=True, text=True, check=True, timeout=25)
              outcome = json.loads(native.stdout)
              if (outcome.get('status') != 'completed' or outcome.get('conclusion') != 'success'
                  or outcome.get('path') != '.github/workflows/pages.yml' or outcome.get('head_sha') != source
                  or outcome.get('head_branch') != 'main' or outcome.get('repository', {}).get('full_name') != REPO
                  or item.get('size_in_bytes') != size or item.get('workflow_run', {}).get('head_sha') != source):
                  raise RuntimeError('Reviewed Pages transport identity changed')
              admitted.append((artifact, run))
          for artifact, run in admitted:
              result = cleanup(REPO, run, 1, artifact, True)
              print('OLD_PAGES_CLEANUP ' + json.dumps(result), flush=True)
          # No source, release asset, review evidence or deployed game was removed.
          PY
