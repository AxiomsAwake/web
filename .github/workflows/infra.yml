name: Publishing infrastructure
on:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', 'catalog/**', '.github/actions/**', '.github/workflows/infra.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publishing-infrastructure
  cancel-in-progress: true
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test independent and racing publications with real Git repositories
        run: python3 -m unittest discover -s tests -v
      - name: Create an isolated browser fixture
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path[:0] = ['tools', 'tests']
          from test_publishing import payload, candidate
          from contract import write_json
          p = payload(Path('fixture'))
          c = candidate(p)
          c['smoke'] = {'ready_selector': '#play', 'steps': [{'click': '#play'}], 'assert_selector': 'body[data-played="yes"]', 'touch': True,
                        'routes': [{'name': 'alternate', 'query': {'mode': 'alternate'}, 'steps': [{'click': '#play'}]}]}
          write_json(Path('fixture-candidate.json'), c)
          PY
      - name: Prepare reusable pinned browser runner
        id: browser
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TOOL_CACHE/axioms-web/playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python3 tools/browser_env.py --work "$RUNNER_TEMP/infra-python"
      - name: Verify browser-environment reuse
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 tools/browser_env.py --work "$RUNNER_TEMP/infra-python" | tee browser-cache.log && grep -q 'Browser checker reused' browser-cache.log
      - name: Verify desktop and touch-sized subpath routes, interaction and reload
        env:
          BROWSER_PYTHON: ${{ steps.browser.outputs.python }}
        run: '"$BROWSER_PYTHON" tools/smoke.py --site alpha --payload fixture --candidate fixture-candidate.json --output evidence'
      - name: Prove console errors fail even with a visible ready canvas
        env:
          BROWSER_PYTHON: ${{ steps.browser.outputs.python }}
        run: |
          echo "console.error('SCRIPT ERROR: intentional regression fixture');" >> fixture/app.js
          if "$BROWSER_PYTHON" tools/smoke.py --site alpha --payload fixture --candidate fixture-candidate.json --output negative-evidence; then
            echo 'Smoke incorrectly accepted an engine console error.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('negative-evidence/report.json') as stream:
              report = json.load(stream)
          assert report['status'] == 'failed' and 'intentional regression fixture' in report['error']
          PY
      - name: Retain browser evidence on the self-hosted runner
        if: always()
        run: |
          for folder in evidence negative-evidence; do
            if test -d "$folder"; then
              destination="$RUNNER_TOOL_CACHE/axioms-evidence/web/$GITHUB_RUN_ID-${GITHUB_RUN_ATTEMPT:-1}/publishing-infrastructure/$folder"
              mkdir -p "$destination"
              cp -R "$folder/." "$destination/"
            fi
          done
