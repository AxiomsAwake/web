<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terrain3D — full Godot editor</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202329;color:#e9edf2;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#17191e;min-height:36px;flex-wrap:wrap}strong{white-space:nowrap}#status{flex:1;min-width:180px;font-size:13px}button{padding:8px 12px;border:1px solid #566779;border-radius:5px;background:#293d50;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button[hidden]{display:none}#return{background:#27604c}canvas{flex:1;min-height:0;display:block;width:100%;outline:0}#error{position:absolute;inset:65px 15px auto;background:#482c2c;padding:16px;white-space:pre-wrap;display:none}
</style>
<link rel="stylesheet" href="moments-panel.css">
<script src="godot.editor.js"></script>
<script defer src="fflate.js"></script>
<script defer src="project-io.js"></script>
<script defer src="native-moments.js"></script>
<script defer src="native-moment-journey.js"></script>
<script defer src="capture-guard.js"></script>
<script defer src="isolation.js"></script>
<script defer src="progress.js"></script>
<script defer src="host.js"></script>
<script defer src="moments-panel.js"></script>
</head>
<body>
<header><strong>Terrain3D · full Godot editor</strong><span id="status" role="status">Loading the complete editor…</span><button id="open">Open native project…</button><button id="download" disabled>Download native project</button><button id="return" disabled hidden>Save &amp; Return to Studio</button><button id="new">New project</button></header>
<input id="project-file" type="file" accept=".zip" hidden>
<canvas id="editor" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><div id="error" role="alert"></div>
</body></html>
