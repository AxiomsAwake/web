<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Romi16 — the 2001 birthday mission, restored for the web." />
    <title>Romi16</title>
    <script type="module" crossorigin src="./assets/index-DvrQyFQ5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C0dfexdf.css">
  </head>
  <body>
    <main id="viewport" aria-label="Romi16 game">
      <canvas id="game" width="1024" height="768"></canvas>
      <div id="hud" aria-live="polite">
        <div id="fps"></div>
        <div id="instructions" class="text-feed"></div>
        <div id="player-text" class="text-feed"></div>
        <button id="lamp" class="inventory-item" type="button" aria-label="Use oil lamp">
          <img src="./assets/textures/lamp-off.png" alt="Oil lamp" draggable="false" />
        </button>
        <button id="map" class="inventory-item" type="button" aria-label="Examine maze map" hidden>
          <img src="./assets/textures/Map.jpg" alt="Map of the maze" draggable="false" />
        </button>
      </div>

      <section id="launch" class="modal visible">
        <div class="modal-panel">
          <h1>ROMI16</h1>
          <p id="launch-status">Restoring mission...</p>
          <label for="visual-style">Surfaces
            <select id="visual-style">
              <option value="original">Original (2001)</option>
              <option value="refreshed">Refreshed marble (optional)</option>
            </select>
          </label>
          <button id="launch-button" type="button" disabled>BEGIN MISSION</button>
          <small>Original game by Michael K for Romi K's 16th birthday · 2001</small>
          <small>WebGL code generated by OpenAI Codex, guided by Romi K · <a href="./CREDITS.txt" target="_blank" rel="noopener">Credits</a></small>
        </div>
      </section>

      <section id="pause" class="modal" aria-hidden="true">
        <div class="modal-panel">
          <h2>MISSION ABORTED</h2>
          <button id="resume-button" type="button">RESUME MISSION</button>
          <button id="restart-button" class="secondary" type="button">RESTART</button>
        </div>
      </section>
    </main>
  </body>
</html>
